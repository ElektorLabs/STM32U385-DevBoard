name=Elektor STM32U385 Dev Board
version=1.0.0
author=Saad Imtiaz
maintainer=Saad Imtiaz <saadimtiazsial@gmail.com>
sentence=Board support for the Elektor STM32U385 Dev Board (260660): LEDs, buttons, Grove power, microSD detect, clocks and chip info.
paragraph=Use the board without opening the schematic. Pin names come from the board package; this library adds LED helpers, debounced buttons with press/release/hold events, run-time system clock switching, clock output on D9, LSE/HSE and MSI-PLL control, and chip information (unique ID, reset cause, temperature, VDDA).
category=Device Control
url=https://github.com/Saad-Imtiaz/Elektor-STM32U385-DevBoard
architectures=stm32
includes=U385Board.h
